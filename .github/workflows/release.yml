name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
            client/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'server/package-lock.json', 'client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install root dependencies
        run: npm ci

      - name: Download TTS models
        run: npm run download:models

      - name: Build client
        working-directory: client
        run: node build.mjs

      - name: Compute release version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("${{ github.ref }}" -match "^refs/tags/v") {
            "version=$v" >> $env:GITHUB_OUTPUT
            "tag=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          } else {
            $bv = "$v-build.$env:GITHUB_RUN_NUMBER"
            "version=$bv" >> $env:GITHUB_OUTPUT
            "tag=v$bv" >> $env:GITHUB_OUTPUT
            "prerelease=true" >> $env:GITHUB_OUTPUT
          }

      - name: Write version to package.json
        shell: pwsh
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $p.version = "${{ steps.version.outputs.version }}"
          $p | ConvertTo-Json -Depth 10 | Set-Content package.json
          Write-Host "Release version: $($p.version)"

      - name: Build installer
        run: npx electron-builder build --win

      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 2>$null
          if ($prev) {
            $log = git log "$prev..HEAD" --oneline --no-decorate
          } else {
            $log = git log --oneline --no-decorate
          }
          $log | Out-File -FilePath release_notes.txt -Encoding utf8
          $notes = Get-Content release_notes.txt -Raw
          Write-Host "Release notes:"
          Write-Host $notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.txt
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            dist-desktop/WaifuAI-Setup-*.exe
            dist-desktop/WaifuAI-Setup-*.exe.blockmap
            dist-desktop/latest.yml
